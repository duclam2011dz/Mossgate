<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#dce8d5" />
    <title>Mossgate</title>
    <link rel="stylesheet" href="/src/pages/menu/style.css" />
  </head>
  <body>
    <main id="app" aria-busy="true">
      <canvas id="menu-background" aria-hidden="true"></canvas>
      <section class="menu">
        <div class="menu-content glass-surface" data-glass-tilt>
          <h1>Mossgate</h1>
          <div class="menu-actions">
            <button id="play" class="primary">Play</button
            ><button id="edit">Editor</button>
          </div>
          <button id="background-choice" class="background-choice">
            Background
          </button>
          <p id="menu-message" role="status"></p>
        </div>
        <dialog id="play-options" class="play-options" data-glass-tilt>
          <div class="chooser-header">
            <h2>Choose a map</h2>
            <button class="dialog-close" aria-label="Close play choices">
              X
            </button>
          </div>
          <div class="map-choices">
            <button
              id="sample-map"
              class="map-choice primary"
              aria-label="Forest Ruins"
              aria-describedby="forest-description"
            >
              <strong>Forest Ruins</strong
              ><span id="forest-description"
                >Five forest stages &middot; classic platforming</span
              >
            </button>
            <button
              id="wildwood-map"
              class="map-choice"
              aria-label="Wildwood Trials"
              aria-describedby="wildwood-description"
            >
              <strong>Wildwood Trials</strong
              ><span id="wildwood-description"
                >Six wild species &middot; survive and reach the gate</span
              >
            </button>
          </div>
          <div class="map-import">
            <button id="open-map">Open level ZIP</button>
          </div>
        </dialog>
        <input
          id="play-file"
          type="file"
          accept=".zip,application/zip"
          hidden
        />
      </section>
    </main>
    <script type="module" src="/src/pages/menu/entry.ts"></script>
  </body>
</html>
