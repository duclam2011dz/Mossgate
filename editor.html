<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#dce8d5" />
    <title>Mossgate - Editor</title>
    <link rel="stylesheet" href="/src/pages/editor/style.css" />
  </head>
  <body>
    <canvas id="editor-background" aria-hidden="true"></canvas>
    <main id="app">
      <section class="editor">
        <header class="editor-bar">
          <button data-action="menu">Menu</button
          ><span class="editor-title">Map Editor</span
          ><button data-action="new">New</button
          ><button data-action="import">Import</button
          ><button data-action="export" class="primary">Export</button
          ><span class="divider"></span
          ><button data-action="undo" aria-label="Undo">Undo</button
          ><button data-action="redo" aria-label="Redo">Redo</button
          ><label
            >W
            <input
              aria-label="Map width"
              id="map-width"
              type="number"
              min="16"
              max="512"
              value="160" /></label
          ><label
            >H
            <input
              aria-label="Map height"
              id="map-height"
              type="number"
              min="12"
              max="128"
              value="40" /></label
          ><button data-action="resize">Resize</button
          ><label
            >Zoom
            <select aria-label="Zoom">
              <option value=".25">25%</option>
              <option value=".5">50%</option>
              <option value="1" selected>100%</option>
              <option value="2">200%</option>
              <option value="4">400%</option>
            </select></label
          >
        </header>
        <aside class="palette">
          <div class="tools" aria-label="Editor tools">
            <button data-tool="brush" aria-pressed="true">Brush</button
            ><button data-tool="erase" aria-pressed="false">Erase</button
            ><button data-tool="rectangle" aria-pressed="false">
              Rectangle</button
            ><button data-tool="fill" aria-pressed="false">Fill</button
            ><button data-tool="select" aria-pressed="false">Select</button
            ><button data-tool="spawn" aria-pressed="false">Spawn</button
            ><button data-tool="portal" aria-pressed="false">Portal</button
            ><button data-tool="inspect" aria-pressed="false">Inspect</button
            ><button data-tool="saw" aria-pressed="false">Saw</button
            ><button data-tool="checkpoint" aria-pressed="false">
              Checkpoint
            </button>
          </div>
          <label class="hitbox-toggle"
            ><input id="show-hitboxes" type="checkbox" /> Show hitboxes</label
          >
          <p class="panel-label">TILES</p>
          <div class="tile-list"></div>
          <p id="tile-info">Solid terrain.</p>
        </aside>
        <div class="workspace">
          <canvas
            id="editor-canvas"
            tabindex="0"
            aria-label="Map editing canvas"
          ></canvas
          ><canvas
            id="minimap"
            aria-label="Map minimap. Click or drag to navigate."
            tabindex="0"
          ></canvas
          ><span id="editor-coordinates"></span>
        </div>
        <footer class="editor-status">
          <span id="editor-notice" role="status"></span
          ><span
            >A/D W/S pan | Wheel zoom | Ctrl+C/V copy/paste | Esc cancel</span
          >
        </footer>
        <input
          id="editor-file"
          type="file"
          accept=".json,application/json"
          hidden
        />
      </section>
    </main>
    <script type="module" src="/src/pages/editor/entry.ts"></script>
  </body>
</html>
